<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonu K Yadav Portfolio</title>
<meta name="description" content="Sonu K Yadav, Mechanical Engineering student at Texas State University. EV battery cooling, suspension analysis, drones, engines and lab work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a personal, photo-led page. One column of chapters, each a full screen; work alternates image and story. */
:root {
  --bg: #f6f2ec;
  --surface: #ece5db;
  --ink: #241d1a;
  --soft: #6b6058;
  --line: #ddd2c5;
  --accent: #7d1f2c;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  --radius: 10px;
  --wrap: 1140px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181412; --surface: #231d1a; --ink: #f2ece4; --soft: #aa9d92; --line: #3a312c; --accent: #e09aa3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181412; --surface: #231d1a; --ink: #f2ece4; --soft: #aa9d92; --line: #3a312c; --accent: #e09aa3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
img, video { max-width: 100%; display: block; }
a { color: inherit; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
a:hover { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }

.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 32px; }

/* nav */
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 64px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 19px; text-decoration: none; }
.brand:hover { color: var(--ink); }
nav ul { list-style: none; display: flex; gap: 26px; }
nav a { text-decoration: none; font-size: 15px; color: var(--soft); }
nav a:hover { color: var(--ink); }

/* chapters */
.chapter { padding: 112px 0; }
.chapter + .chapter { border-top: 1px solid var(--line); }
.kicker { font-size: 15px; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
.chapter > .wrap > h2 { font-size: clamp(36px, 4.6vw, 56px); max-width: 16ch; }
.lead { font-size: 21px; color: var(--soft); max-width: 40em; margin-top: 18px; }

/* hero */
.hero { padding: 72px 0 104px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 72px; align-items: center; }
.hero .hello { font-size: 17px; color: var(--soft); }
.hero h1 { font-size: clamp(54px, 8vw, 104px); font-weight: 700; margin: 10px 0 26px; letter-spacing: -0.035em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lede { font-size: 23px; line-height: 1.5; max-width: 26em; }
.hero .summary { margin-top: 18px; color: var(--soft); max-width: 34em; }
.hero .links { display: flex; flex-wrap: wrap; gap: 14px 28px; margin-top: 34px; font-weight: 500; }
.pill { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; transition: transform .2s ease; }
.pill:hover { color: var(--bg); transform: translateY(-2px); }
.hero .links a:not(.pill) { padding: 12px 0; }
.portrait { margin: 0; }
.portrait .frame { border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 5; background: var(--surface); }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
.portrait figcaption { margin-top: 12px; font-size: 15px; color: var(--soft); font-style: italic; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 30px; font-size: 15px; color: var(--soft); }
.facts b { color: var(--ink); font-weight: 600; }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 72px; margin-top: 44px; }
.about .prose p { font-size: 21px; line-height: 1.6; }
.about .prose p + p { margin-top: 20px; }
.now h3 { font-size: 15px; font-family: var(--body); font-weight: 600; color: var(--soft); letter-spacing: 0; margin-bottom: 8px; }
.now li { list-style: none; padding: 14px 0; border-bottom: 1px solid var(--line); }
.now li b { display: block; font-weight: 600; }
.now li span { color: var(--soft); font-size: 16px; }

/* work */
.work-list { margin-top: 64px; display: grid; gap: 120px; }
.work { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.work.flip { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
.work.flip .w-media { order: 2; }
.w-meta { font-size: 15px; color: var(--soft); }
.w-meta .acc { color: var(--accent); font-weight: 600; }
.work h3 { font-size: clamp(30px, 3.2vw, 42px); margin: 10px 0 18px; }
.work .story { font-size: 18px; }
.w-facts { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
.w-facts div { border-top: 1px solid var(--line); padding-top: 10px; }
.w-facts dt { font-size: 14px; color: var(--soft); }
.w-facts dd { margin: 2px 0 0; font-size: 16px; font-weight: 500; }
.progress { margin-top: 28px; }
.progress p { font-size: 15px; color: var(--soft); }
.progress p b { color: var(--ink); font-weight: 600; }
.progress .bar { display: grid; gap: 4px; margin-top: 10px; }
.progress .bar span { height: 5px; border-radius: 3px; background: var(--line); }
.progress .bar span.on { background: var(--accent); }
.links-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.links-row a { font-weight: 500; }

.stage { margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--surface); aspect-ratio: 4 / 3; position: relative; }
.stage img, .stage video { width: 100%; height: 100%; object-fit: cover; }
.stage img { cursor: zoom-in; transition: transform .6s ease; }
.stage:hover img { transform: scale(1.02); }
.stage video { object-fit: contain; background: #fff; }
.analysis-stage { aspect-ratio: 16 / 10; background: #25282d; }
.analysis-stage img { object-fit: contain; }
.analysis-stage video { background: #25282d; }
.analysis-video { margin-top: 28px; }
.analysis-video-label { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
.cap { margin-top: 12px; font-size: 15px; color: var(--soft); font-style: italic; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.thumbs button { width: 68px; aspect-ratio: 1; padding: 0; border: 0; border-radius: 6px; overflow: hidden; cursor: pointer; opacity: .55; background: var(--surface); transition: opacity .2s; position: relative; }
.thumbs button img { width: 100%; height: 100%; object-fit: cover; }
.thumbs button:hover, .thumbs button[aria-current="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--accent); }
.thumbs .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair button, .mosaic button, .collage button, .solo button { padding: 0; border: 0; border-radius: var(--radius); overflow: hidden; cursor: zoom-in; background: var(--surface); position: relative; min-height: 0; min-width: 0; }
.pair button { aspect-ratio: 1; }
.pair img, .mosaic img, .collage img, .solo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.pair button:hover img, .mosaic button:hover img, .collage button:hover img, .solo button:hover img { transform: scale(1.03); }

/* numbers card for projects without photos yet */
.numbers { border-radius: var(--radius); background: var(--surface); padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 36px 32px; }
.numbers div b { display: block; font-family: var(--display); font-weight: 600; font-size: clamp(40px, 4.6vw, 60px); line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.numbers div b small { font-size: .38em; font-weight: 500; letter-spacing: 0; margin-left: 4px; color: var(--soft); }
.numbers div span { display: block; margin-top: 8px; font-size: 15px; color: var(--soft); line-height: 1.45; }
.numbers .note { grid-column: 1 / -1; font-size: 14px; color: var(--soft); font-style: italic; border-top: 1px solid var(--line); padding-top: 16px; }

.small-work { margin-top: 120px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.next { border-radius: var(--radius); border: 1px solid var(--line); padding: 32px; }
.next h3 { font-size: 26px; margin: 8px 0 12px; }

/* research */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 64px; margin-top: 44px; align-items: start; }
.split .story { font-size: 19px; }
.tags { margin-top: 22px; color: var(--soft); font-size: 16px; }
.mosaic { display: grid; grid-template-columns: 1.3fr 1fr; grid-template-rows: 220px 220px; gap: 12px; }
.mosaic button:first-child { grid-row: 1 / 3; }

/* lab */
.collage { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 230px 230px; gap: 12px; margin-top: 48px; }
.collage .c1 { grid-row: 1 / 3; }
.collage .c2 { grid-row: 1 / 3; }
.collage .c5 { grid-column: 3 / 5; }
.collage .c3 { grid-column: 3; } .collage .c4 { grid-column: 4; }
.collage .c6 { display: none; }
.collage .c5 img { object-position: center 60%; }
.tests { margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 28px; }
.tests li { list-style: none; border-top: 2px solid var(--ink); padding-top: 14px; }
.tests b { font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
.tests span { display: block; margin-top: 6px; font-size: 16px; color: var(--soft); line-height: 1.5; }
.lab-intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 64px; margin-top: 28px; align-items: end; }
.lab-intro p { font-size: 20px; }
.lab-num { display: flex; gap: 40px; }
.lab-num div b { display: block; font-family: var(--display); font-weight: 600; font-size: 48px; line-height: 1; letter-spacing: -0.03em; color: var(--accent); }
.lab-num div span { font-size: 15px; color: var(--soft); }

/* leadership */
.solo button { display: block; width: 100%; aspect-ratio: 4 / 5; }

/* experience */
.roles { margin-top: 48px; }
.role { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; padding: 28px 0; border-top: 1px solid var(--line); }
.role .when { color: var(--soft); font-size: 16px; }
.role .when i { display: block; font-style: normal; color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 4px; }
.role h3 { font-family: var(--body); font-size: 20px; font-weight: 600; letter-spacing: 0; }
.role .org { color: var(--soft); }
.role ul { margin-top: 10px; padding-left: 20px; max-width: 64ch; }
.role li + li { margin-top: 6px; }

/* skills + education */
.two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 72px; margin-top: 48px; }
.skillgroups { display: grid; gap: 28px; }
.skillgroups h3 { font-family: var(--body); font-size: 16px; font-weight: 600; letter-spacing: 0; color: var(--soft); margin-bottom: 6px; }
.skillgroups p { font-size: 18px; }
.edu h3 { font-size: 28px; }
.edu .deg { margin-top: 6px; }
.edu .grad { color: var(--soft); font-size: 16px; margin-top: 2px; }
.edu h4 { margin: 28px 0 8px; font-size: 16px; font-weight: 600; color: var(--soft); }
.edu ul { list-style: none; }
.edu li { padding: 6px 0; border-bottom: 1px solid var(--line); }

/* contact */
.contact h2 { font-size: clamp(48px, 7vw, 92px) !important; max-width: none !important; letter-spacing: -0.035em; }
.contact .lead { color: var(--ink); }
.contact .big { display: inline-block; margin-top: 34px; font-family: var(--display); font-size: clamp(24px, 3.4vw, 40px); font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.contact .others { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px 28px; color: var(--soft); }
footer { padding: 32px 0 48px; color: var(--soft); font-size: 14px; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 24px; }


/* approach */
.steps { list-style: none; margin-top: 52px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 28px; counter-reset: st; }
.steps li { counter-increment: st; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--bg); font-family: var(--display); font-weight: 600; font-size: 18px; margin-bottom: 16px; }
.steps b { display: block; font-family: var(--display); font-size: 21px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
.steps span { display: block; margin-top: 8px; font-size: 16px; color: var(--soft); line-height: 1.55; }

/* phase checklist */
.phaselist { list-style: none; margin-top: 26px; border-top: 1px solid var(--line); }
.phaselist li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 16px; color: var(--soft); }
.phaselist li i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 4px; display: grid; place-items: center; font-size: 11px; }
.phaselist li.done { color: var(--ink); }
.phaselist li.done i { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.phaselist li.now { color: var(--ink); font-weight: 600; }
.phaselist li.now i { border-color: var(--accent); box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 9px var(--accent); }
.phaselist li.now em { font-style: normal; font-weight: 500; color: var(--accent); font-size: 14px; margin-left: 8px; }
.phase-note { margin-top: 12px; font-size: 15px; color: var(--soft); font-style: italic; }
.results-block { margin-top: 28px; }
.results-block h4 { font-family: var(--display); font-size: 22px; line-height: 1.2; margin-bottom: 14px; }
.results-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.results-table { border-collapse: collapse; width: 100%; min-width: 390px; font-size: 14px; font-variant-numeric: tabular-nums; }
.results-table th, .results-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--line); }
.results-table th { font-weight: 600; background: var(--surface); color: var(--soft); }
.results-table tr:last-child td { border-bottom: 0; }
.results-table tr.baseline td { background: color-mix(in srgb, var(--accent) 9%, transparent); font-weight: 600; }
.results-note { margin-top: 12px; font-size: 14px; line-height: 1.55; color: var(--soft); }
.results-caveat { border-left: 3px solid var(--accent); padding-left: 14px; margin-top: 15px; }

/* downloads */
.dl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; margin-top: 26px; }
.dl { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; padding: 12px 20px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; font-weight: 500; transition: background .2s, color .2s; }
.dl:hover { background: var(--ink); color: var(--bg); }
.dl small { font-size: 13px; opacity: .7; font-weight: 400; }
.dl.minor { border: 0; padding: 0; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--soft); }
.dl.minor:hover { background: none; color: var(--accent); }
.dl-msg { font-size: 14px; color: var(--soft); width: 100%; min-height: 1em; }

/* lab (one section) */
.lab-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 64px; margin-top: 36px; }
.lab-top p { font-size: 20px; line-height: 1.6; }
.lab-top p + p { margin-top: 0; }
.labgrid { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1.2fr; grid-template-rows: 250px 250px; gap: 12px; margin-top: 52px; }
.labgrid button { padding: 0; border: 0; border-radius: var(--radius); overflow: hidden; cursor: zoom-in; background: var(--surface); position: relative; min-height: 0; min-width: 0; }
.labgrid img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s ease; }
.labgrid button:hover img { transform: scale(1.03); }
.labgrid .g1 { grid-row: 1 / 3; }
.labgrid .g2 { grid-row: 1 / 3; }
.labgrid .g5 img { object-position: center 62%; }
.labgrid figcaption, .labgrid .lc { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #fff; font-size: 13px; line-height: 1.35; text-align: left; text-shadow: 0 1px 6px rgba(0,0,0,.7); opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
.labgrid button:hover .lc, .labgrid button:focus-visible .lc { opacity: 1; transform: none; }

/* leadership list */
.leads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; margin-top: 48px; align-items: start; }
.lead-card .solo button { aspect-ratio: 4 / 3; }
.lead-card .solo img { object-position: center 30%; }
.lead-card h3 { font-size: 28px; margin: 6px 0 10px; }
.lead-card.noimg { border-radius: var(--radius); background: var(--surface); padding: 36px; align-self: stretch; display: flex; flex-direction: column; justify-content: flex-end; }
.lead-card.noimg .big-org { font-family: var(--display); font-size: clamp(44px, 5vw, 68px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--accent); margin-bottom: auto; padding-bottom: 40px; }

/* seeking */
.areas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; list-style: none; }
.areas li { padding: 8px 16px; border-radius: 999px; background: var(--surface); font-size: 16px; }

@media (max-width: 960px) {
  .steps { grid-template-columns: 1fr 1fr; }
  .lab-top, .leads { grid-template-columns: 1fr; gap: 24px; }
  .labgrid { grid-template-columns: 1fr 1fr; grid-template-rows: 240px 240px 170px 170px; }
  .labgrid .g1 { grid-row: 1 / 3; grid-column: 1; } .labgrid .g2 { grid-row: 1 / 3; grid-column: 2; }
  .labgrid .lc { opacity: 1; transform: none; }
}
@media (max-width: 700px) {
  .steps { grid-template-columns: 1fr; gap: 22px; }
  .steps li { display: grid; grid-template-columns: 52px 1fr; }
  .steps li::before { margin: 0; }
  .labgrid { grid-template-rows: 200px 200px 140px 140px; }
}


/* bands: give the page rhythm */
.band-soft { background: var(--surface); }
.band-dark { --bg: #1f1916; --surface: #2b2420; --ink: #f3ede5; --soft: #b8aa9e; --line: #3b322c; --accent: #e6a3ab; background: var(--bg); color: var(--ink); }
.band-accent { --bg: #7d1f2c; --surface: rgba(255,255,255,.12); --ink: #fbf4ee; --soft: #ecc9cc; --line: rgba(255,255,255,.22); --accent: #ffd9a8; background: var(--bg); color: var(--ink); }
:root[data-theme="dark"] .band-dark { --bg: #262019; --surface: #312922; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .band-dark { --bg: #262019; --surface: #312922; } }
:root[data-theme="dark"] .band-accent { --bg: #5a1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .band-accent { --bg: #5a1620; } }
.chapter.band-soft, .chapter.band-dark, .chapter.band-accent, .chapter.band-soft + .chapter, .chapter.band-dark + .chapter, .chapter.band-accent + .chapter { border-top: 0; }
.band-accent .areas li { background: rgba(255,255,255,.12); }
.band-accent .big { color: var(--ink); }
.band-accent a:hover { color: var(--accent); }
.band-accent + footer, footer { }

/* about manifesto */
.about2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.9fr); gap: 72px; align-items: start; }
.manifesto { font-size: clamp(40px, 5.4vw, 72px) !important; font-weight: 700 !important; letter-spacing: -0.035em; line-height: 1.02 !important; max-width: 14ch; }
.about2 .prose { margin-top: 36px; display: grid; gap: 18px; max-width: 36em; }
.about2 .prose p { font-size: 19px; line-height: 1.65; color: var(--soft); }
.about2 .prose p:first-child { font-size: 22px; color: var(--ink); }
.about-photo { margin: 0; position: sticky; top: 96px; }
.about-photo .solo button { aspect-ratio: 3 / 4; }
.about-photo figcaption { margin-top: 12px; font-size: 15px; color: var(--soft); font-style: italic; }
.bynum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--line); }
.bynum b { display: block; font-family: var(--display); font-weight: 700; font-size: clamp(44px, 5vw, 68px); line-height: 1; letter-spacing: -0.035em; color: var(--accent); }
.bynum span { display: block; margin-top: 10px; font-size: 16px; color: var(--soft); max-width: 18ch; }
@media (max-width: 960px) { .about2 { grid-template-columns: 1fr; gap: 40px; } .about-photo { position: static; max-width: 420px; } .bynum { grid-template-columns: 1fr 1fr; } }


.about-intro { margin-top: 32px; font-size: 22px; line-height: 1.55; max-width: 32em; }
.about2 { align-items: center !important; }
.about-photo { position: static !important; }
.traits { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 72px; counter-reset: tr; }
.traits li { counter-increment: tr; background: var(--surface); border-radius: var(--radius); padding: 32px 32px 34px; position: relative; overflow: hidden; }
.traits li::before { content: "0" counter(tr); position: absolute; right: 22px; top: 8px; font-family: var(--display); font-weight: 700; font-size: 84px; line-height: 1; letter-spacing: -0.04em; color: var(--accent); opacity: .16; }
.traits h3 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; max-width: 16ch; color: var(--ink); }
.traits p { margin-top: 12px; color: var(--soft); font-size: 17px; line-height: 1.6; }
.traits li:hover::before { opacity: .3; transition: opacity .3s; }
@media (max-width: 760px) { .traits { grid-template-columns: 1fr; } .traits li { padding: 26px; } }

.band-soft .areas li { background: var(--bg); }
.robo-tags { margin-top: 24px; }
.mosaic { grid-template-rows: 250px 250px !important; }
@media (max-width: 700px) { .mosaic { grid-template-rows: 170px 170px !important; } }


/* hero v2: photo runs to the screen edge */
.hero2 { display: grid; grid-template-columns: minmax(0, 1fr) min(46vw, 680px); min-height: min(88vh, 860px); align-items: stretch; }
.hero2-text { align-self: center; padding: 72px 64px 72px max(32px, calc((100vw - var(--wrap)) / 2 + 32px)); }
.hero2 .hello { font-size: 16px; color: var(--soft); }
.hero2 h1 { font-size: clamp(60px, 8.6vw, 132px); font-weight: 700; margin: 8px 0 28px; letter-spacing: -0.045em; line-height: .95; animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
.hero2 h1 em { font-style: normal; color: var(--accent); }
.hero2 .lede { font-family: var(--display); font-size: clamp(24px, 2.3vw, 32px); font-weight: 500; line-height: 1.3; letter-spacing: -0.015em; max-width: 22em; animation: up .8s .08s cubic-bezier(.2,.7,.2,1) both; }
.hero2 .summary { margin-top: 20px; font-size: 19px; color: var(--soft); max-width: 32em; }
.hero2 .links { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 36px; font-weight: 500; }
.hero2-photo { margin: 0; position: relative; overflow: hidden; background: var(--surface); }
.hero2-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; animation: zoomout 1.6s cubic-bezier(.2,.7,.2,1) both; }
.hero2-photo figcaption { position: absolute; left: 20px; bottom: 20px; right: 20px; max-width: max-content; padding: 8px 14px; border-radius: 999px; background: rgba(24, 20, 18, .62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #f6efe7; font-size: 14px; }
@keyframes zoomout { from { transform: scale(1.06); } to { transform: none; } }


/* nicer section headings */
.chapter > .wrap > h2 { font-weight: 700; letter-spacing: -0.035em; }
.kicker { display: inline-flex; align-items: center; gap: 10px; }
.kicker::before { content: ""; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }
.work h3 { font-weight: 700; letter-spacing: -0.03em; }
.stage, .numbers, .pair button, .mosaic button, .labgrid button, .solo button { box-shadow: 0 1px 2px rgba(36,29,26,.06), 0 12px 32px -12px rgba(36,29,26,.22); }
.band-dark .solo button, .band-dark .labgrid button { box-shadow: 0 16px 40px -16px rgba(0,0,0,.6); }

@media (max-width: 960px) {
  .hero2 { grid-template-columns: 1fr; min-height: 0; }
  .hero2-text { padding: 40px 32px 48px; }
  .hero2-photo { height: 70vh; max-height: 620px; order: -1; }
}
@media (max-width: 700px) {
  .hero2-text { padding: 32px 20px 44px; }
  .hero2-photo { height: 62vh; }
}




/* design slideshow */
.showcase { position: relative; background: #14100e; color: #f6efe7; overflow: hidden; }
.sc-slides { position: relative; height: clamp(440px, 62vh, 660px); }
.sc-slide { position: absolute; inset: 0; margin: 0; opacity: 0; transition: opacity .9s ease; }
.sc-slide.on { opacity: 1; }
.sc-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(28px) brightness(.45) saturate(1.1); }
.sc-slide img { position: absolute; top: 0; bottom: 0; right: 0; width: 64%; height: 100%; object-fit: cover; object-position: center; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%); mask-image: linear-gradient(90deg, transparent 0, #000 22%); transform: scale(1.04); transition: transform 7s ease-out; }
.sc-slide.on img { transform: none; }
.sc-slide::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(20,16,14,.94) 0, rgba(20,16,14,.82) 34%, rgba(20,16,14,.18) 58%, transparent 72%), linear-gradient(0deg, rgba(20,16,14,.75) 0, transparent 26%); }
.sc-slide figcaption { z-index: 1; }
.sc-slide figcaption { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: grid; gap: 14px; }
.sc-slide figcaption > * { max-width: 30rem; }
.sc-proj { font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f0b8bf; display: inline-flex; align-items: center; gap: 10px; }
.sc-proj::before { content: ""; width: 26px; height: 2px; background: currentColor; border-radius: 2px; }
.sc-title { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 4.2vw, 60px); line-height: 1.02; letter-spacing: -0.035em; text-wrap: balance; }
.sc-detail { font-size: 18px; line-height: 1.55; color: #d9cdc2; }
.sc-slide.on figcaption > * { animation: scIn .9s cubic-bezier(.2,.7,.2,1) both; }
.sc-slide.on .sc-title { animation-delay: .08s; } .sc-slide.on .sc-detail { animation-delay: .16s; }
@keyframes scIn { from { transform: translateY(12px); } to { transform: none; } }
.sc-ui { position: absolute; z-index: 2; left: 0; right: 0; bottom: 28px; display: flex; align-items: center; gap: 24px; }
.sc-count { font-size: 14px; color: #cbbfb4; font-variant-numeric: tabular-nums; min-width: 64px; }
.sc-count b { color: #fff; font-weight: 600; }
.sc-bars { display: flex; gap: 8px; flex: 1; max-width: 420px; }
.sc-bars button { flex: 1; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; align-items: center; }
.sc-bars i { display: block; height: 3px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; position: relative; }
.sc-bars button.on i::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; animation: scFill var(--sc-dur, 6s) linear both; }
.showcase.paused .sc-bars button.on i::after { animation-play-state: paused; }
@keyframes scFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.sc-arrows { margin-left: auto; display: flex; gap: 10px; }
.sc-arrows button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(20,16,14,.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); color: #fff; font-size: 18px; cursor: pointer; transition: background .2s, border-color .2s; }
.sc-arrows button:hover { background: #fff; color: #14100e; border-color: #fff; }
@media (prefers-reduced-motion: reduce) { .sc-bars button.on i::after { animation: none; transform: none; } }
@media (max-width: 860px) {
  .sc-slides { height: auto; aspect-ratio: auto; min-height: 0; display: grid; }
  .sc-slide { position: relative; grid-area: 1 / 1; display: grid; grid-template-rows: 300px auto; }
  .sc-slide img { position: relative; width: 100%; height: 300px; -webkit-mask-image: linear-gradient(0deg, transparent 0, #000 30%); mask-image: linear-gradient(0deg, transparent 0, #000 30%); }
  .sc-slide figcaption { position: relative; top: auto; transform: none; padding-top: 4px; padding-bottom: 96px; }
  .sc-slide::after { background: linear-gradient(0deg, rgba(20,16,14,.6) 0, transparent 30%); }
  .sc-title { font-size: 30px; }
  .sc-detail { font-size: 16px; }
  .sc-ui { bottom: 22px; gap: 14px; }
  .sc-arrows button { width: 40px; height: 40px; }
}

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(20, 16, 14, .94); display: none; place-items: center; padding: 24px; }
.lightbox.open { display: grid; }
.lightbox figure { margin: 0; max-width: min(1200px, 100%); }
.lightbox img { max-height: 82vh; width: auto; margin: 0 auto; border-radius: 6px; }
.lightbox figcaption { color: #eee5dc; text-align: center; margin-top: 14px; font-size: 15px; font-style: italic; }
.lightbox button { position: absolute; top: 18px; right: 18px; background: transparent; color: #eee5dc; border: 1px solid rgba(238,229,220,.5); border-radius: 999px; padding: 8px 18px; cursor: pointer; }

/* entrance: content is visible at rest; this only lifts it slightly on load */
.hero h1, .hero .lede, .portrait { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
.hero .lede { animation-delay: .08s; } .portrait { animation-delay: .12s; }
@keyframes up { from { transform: translateY(14px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 960px) {
  .hero .wrap, .about, .work, .work.flip, .split, .two, .lab-intro, .small-work { grid-template-columns: 1fr; gap: 40px; }
  .work.flip .w-media { order: 0; }
  .portrait { max-width: 440px; }
  nav ul { gap: 18px; }
  .chapter { padding: 88px 0; }
}
@media (max-width: 700px) {
  nav { display: none; }
  .wrap { padding: 0 20px; }
  body { font-size: 17px; }
  .chapter { padding: 72px 0; }
  .hero { padding-top: 32px; }
  .hero .lede { font-size: 20px; }
  .numbers { padding: 28px; gap: 28px 20px; }
  .w-facts { grid-template-columns: 1fr; }
  .collage { grid-template-columns: 1fr 1fr; grid-template-rows: 220px 220px 150px; }
  .collage .c1 { grid-row: 1 / 3; grid-column: 1; } .collage .c2 { grid-row: 1 / 3; grid-column: 2; }
  .collage .c3 { grid-column: 1; grid-row: 3; } .collage .c4 { grid-column: 2; grid-row: 3; }
  .collage .c5 { display: none; }
  .mosaic { grid-template-rows: 160px 160px; }
  .role { grid-template-columns: 1fr; gap: 4px; }
  .work-list { gap: 88px; }
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="#top" id="brand">Sonu K Yadav</a><nav aria-label="Main"><ul id="nav-links"></ul></nav></div></header>
<main id="main"></main>
<footer><div class="wrap" id="footer"></div></footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" id="lb-close">Close</button>
  <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
</div>

<script src="content.js"></script>
<script>
(function () {
  const D = window.PORTFOLIO;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const has = (m) => m && m.src;
  const statusWord = { "in-progress": "In progress", "complete": "", "side-project": "Side project", "upcoming": "Up next" };
  const zoom = (m, cls) => `<button type="button" class="${cls || ""}" aria-label="Enlarge photo: ${esc(m.caption)}"><img src="${esc(m.src)}" alt="${esc(m.caption || "")}" data-cap="${esc(m.caption || "")}"></button>`;
  const facts = (rows) => rows && rows.length ? `<dl class="w-facts">${rows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : "";
  const meta = (p) => {
    const bits = [];
    if (statusWord[p.status]) bits.push(`<span class="acc">${esc(statusWord[p.status])}</span>`);
    if (p.award) bits.push(`<span class="acc">${esc(p.award)}</span>`);
    bits.push(esc(p.course));
    if (p.dates) bits.push(esc(p.dates));
    return `<p class="w-meta">${bits.join(" · ")}</p>`;
  };
  const P = D.profile;
  const first = P.name.split(" ")[0];
  const chapters = [];
  const chapter = (id, label, kicker, title, inner, extra) => chapters.push({ id, label, html: `<section class="chapter ${extra || ""}" id="${id}" aria-labelledby="${id}-h"><div class="wrap">${kicker ? `<p class="kicker">${esc(kicker)}</p>` : ""}<h2 id="${id}-h">${title}</h2>${inner}</div></section>` });

  /* hero */
  const hero = `
    <section class="hero2" id="top">
      <div class="hero2-text">
        <p class="hello">${esc(P.headline)}</p>
        <h1>Hi, I'm <em>${esc(first)}</em>.</h1>
        <p class="lede">${esc(P.lede)}</p>
        <p class="summary">${esc(P.summary)}</p>
        <div class="links">
          <a class="pill" href="#work">See my projects</a>
          <a href="mailto:${esc(P.email)}">Email me</a>
          <a href="${esc(P.linkedin)}">LinkedIn ↗</a>
          ${P.github ? `<a href="${esc(P.github)}">GitHub ↗</a>` : ""}
        </div>
        <p class="facts"><span><b>${esc(P.degree)}</b></span><span>Graduating <b>${esc(P.graduation)}</b></span><span>Open to internships, co-ops and full-time roles</span></p>
      </div>
      ${has(P.portrait) ? `<figure class="hero2-photo"><img src="${esc(P.portrait.src)}" alt="${esc(P.portrait.alt)}">${P.portrait.caption ? `<figcaption>${esc(P.portrait.caption)}</figcaption>` : ""}</figure>` : ""}
    </section>
    ${(P.showcase || []).length ? `<section class="showcase" aria-roledescription="carousel" aria-label="My designs">
      <div class="sc-slides">${P.showcase.map((sl, i) => `
        <figure class="sc-slide${i === 0 ? " on" : ""}" aria-roledescription="slide" aria-label="${i + 1} of ${P.showcase.length}" ${i ? 'aria-hidden="true"' : ""}>
          <div class="sc-bg" style="background-image:url('${esc(sl.src)}')"></div>
          <img src="${esc(sl.src)}" alt="${esc(sl.project)}: ${esc(sl.title)}" ${i ? 'loading="lazy"' : ""}>
          <figcaption class="wrap"><span class="sc-proj">${esc(sl.project)}</span><span class="sc-title">${esc(sl.title)}</span><span class="sc-detail">${esc(sl.detail)}</span></figcaption>
        </figure>`).join("")}</div>
      <div class="sc-ui wrap">
        <span class="sc-count" aria-live="polite"><b>01</b> / ${String(P.showcase.length).padStart(2, "0")}</span>
        <div class="sc-bars">${P.showcase.map((_, i) => `<button type="button" aria-label="Show slide ${i + 1}" class="${i === 0 ? "on" : ""}"><i></i></button>`).join("")}</div>
        <div class="sc-arrows"><button type="button" class="sc-prev" aria-label="Previous slide">←</button><button type="button" class="sc-next" aria-label="Next slide">→</button></div>
      </div>
    </section>` : ""}`;

  /* about */
  const A = D.about;
  if (A) chapters.push({ id: "about", label: "About", html: `
    <section class="chapter band-dark about-band" id="about" aria-labelledby="about-h"><div class="wrap">
      <div class="about2">
        <div>
          <p class="kicker">About me</p>
          <h2 id="about-h" class="manifesto">${esc(A.headline)}</h2>
          <p class="about-intro">${esc(A.intro || "")}</p>
        </div>
        ${has(A.photo) ? `<figure class="about-photo"><div class="solo">${zoom(A.photo)}</div><figcaption>${esc(A.photo.caption)}</figcaption></figure>` : ""}
      </div>
      ${(A.traits || []).length ? `<ul class="traits">${A.traits.map(([t, d]) => `<li><h3>${esc(t)}</h3><p>${esc(d)}</p></li>`).join("")}</ul>` : ""}
      ${(A.numbers || []).length ? `<div class="bynum">${A.numbers.map((n) => `<div><b>${esc(n.value)}</b><span>${esc(n.label)}</span></div>`).join("")}</div>` : ""}
    </div></section>` });

  /* approach */
  const AP = D.approach;
  if (AP) chapter("approach", "Approach", "How I work", esc(AP.title), `
    <p class="lead">${esc(AP.intro)}</p>
    <ol class="steps">${AP.steps.map(([t, d]) => `<li><div><b>${esc(t)}</b><span>${esc(d)}</span></div></li>`).join("")}</ol>`, "band-soft");

  /* downloads */
  const dls = (list) => {
    const l = (list || []).filter((d) => d && d.href);
    if (!l.length) return "";
    return `<div class="dl-row">${l.filter((d) => d.href).map((d) => `<a class="dl${d.minor ? " minor" : ""}" href="${esc(d.href)}">${d.minor ? "" : "↓ "}${esc(d.label)}${d.size ? ` <small>${esc(d.size)}</small>` : ""}</a>`).join("")}</div>`;
  };

  /* work */
  let flip = 0;
  const thumbs = (id, list) => `<div class="thumbs" role="group" aria-label="More images">${list.map((m, j) => `<button type="button" data-target="${esc(id)}" data-src="${esc(m.src)}" data-cap="${esc(m.caption)}" aria-label="Show: ${esc(m.caption)}" aria-current="${j === 0}"><img src="${esc(m.src)}" alt=""></button>`).join("")}</div>`;
  const analysisBlock = (F) => {
    const g = (F.gallery || []).filter(has);
    const gallery = g.length
      ? `<figure class="stage analysis-stage" data-gallery="${esc(F.id)}"><img src="${esc(g[0].src)}" alt="${esc(g[0].caption)}" data-cap="${esc(g[0].caption)}"></figure><p class="cap" data-gcap="${esc(F.id)}">${esc(g[0].caption)}</p>${g.length > 1 ? thumbs(F.id, g) : ""}`
      : `<div class="numbers">${F.stats.map((s) => `<div><b>${esc(s.value)}${s.unit ? `<small>${esc(s.unit)}</small>` : ""}</b><span>${esc(s.label)}</span></div>`).join("")}<p class="note">Screenshots and results coming soon. I'm finishing this one now.</p></div>`;
    const video = has(F.video) ? `<div class="analysis-video"><p class="analysis-video-label">Coolant-flow visualization</p><figure class="stage analysis-stage"><video src="${esc(F.video.src)}" poster="${esc(F.video.poster || "")}" controls playsinline preload="metadata" aria-label="${esc(F.video.caption)}"></video></figure><p class="cap">${esc(F.video.caption)} <a href="${esc(F.video.src)}" download>Download video</a></p></div>` : "";
    const results = (F.results || []).length ? `<section class="results-block" aria-label="CFD results"><h4>What the simulations showed</h4><div class="results-scroll"><table class="results-table"><thead><tr><th scope="col">Flow</th><th scope="col">Coolant outlet</th><th scope="col">Peak cell</th><th scope="col">Coolant ΔT</th></tr></thead><tbody>${F.results.map((r) => `<tr class="${r.baseline ? "baseline" : ""}"><td>${esc(r.flow)}${r.baseline ? " ★" : ""}</td><td>${esc(r.outlet)}</td><td>${esc(r.maxCell)}</td><td>${esc(r.rise)}</td></tr>`).join("")}</tbody></table></div>${F.resultsNote ? `<p class="results-note">${esc(F.resultsNote)}</p>` : ""}${F.limitations ? `<p class="results-note results-caveat"><b>Engineering caveat:</b> ${esc(F.limitations)}</p>` : ""}</section>` : "";
    return `
      <article class="work${flip++ % 2 ? " flip" : ""}" id="${esc(F.id)}">
        <div class="w-media">${gallery}${video}${facts(F.specs)}</div>
        <div>
          ${meta(F)}
          <h3>${esc(F.title)}</h3>
          <p class="story">${esc(F.summary)}</p>
          ${results}
          <ol class="phaselist" aria-label="Project steps">${F.phases.map((p, i) => `<li class="${i < F.current ? "done" : i === F.current ? "now" : ""}"><i aria-hidden="true">${i < F.current ? "✓" : ""}</i><span>${esc(p)}${i === F.current ? "<em>working on it now</em>" : ""}</span></li>`).join("")}</ol>
          ${dls(F.downloads)}
        </div>
      </article>`;
  };
  const caseBlock = (c) => {
    let media = "";
    if (c.kind === "video" && c.videos && c.videos.length) {
      const v0 = c.videos[0];
      media = `<figure class="stage" data-vgallery="${esc(c.id)}"><video src="${esc(v0.src)}" poster="${esc(v0.poster || "")}" controls playsinline preload="metadata"${v0.autoplay ? " autoplay muted loop" : ""}></video></figure><p class="cap" data-vcap="${esc(c.id)}">${esc(v0.caption)}</p>
        ${c.videos.length > 1 ? `<div class="thumbs" role="group" aria-label="Videos">${c.videos.map((v, j) => `<button type="button" data-vtarget="${esc(c.id)}" data-src="${esc(v.src)}" data-poster="${esc(v.poster || "")}" data-cap="${esc(v.caption)}" data-auto="${v.autoplay ? 1 : 0}" aria-label="Play: ${esc(v.caption)}" aria-current="${j === 0}"><img src="${esc(v.poster || "")}" alt=""><span class="play" aria-hidden="true">▶</span></button>`).join("")}</div>` : ""}`;
    } else {
      const imgs = (c.media || []).filter(has);
      if (imgs.length) media = `<figure class="stage" data-gallery="${esc(c.id)}"><img src="${esc(imgs[0].src)}" alt="${esc(imgs[0].caption)}" data-cap="${esc(imgs[0].caption)}"></figure><p class="cap" data-gcap="${esc(c.id)}">${esc(imgs[0].caption)}</p>${imgs.length > 1 ? thumbs(c.id, imgs) : ""}`;
    }
    return `
      <article class="work${flip++ % 2 ? " flip" : ""}" id="${esc(c.id)}">
        <div class="w-media">${media}</div>
        <div>
          ${meta(c)}
          <h3>${esc(c.title)}</h3>
          <p class="story">${esc(c.story)}</p>
          ${facts(c.specs)}
          ${dls(c.downloads)}
        </div>
      </article>`;
  };
  const smalls = (D.projects || []).map((p) => {
    const imgs = (p.media || []).filter(has);
    return `<div>${imgs.length ? `<div class="pair">${imgs.slice(0, 2).map((m) => zoom(m)).join("")}</div>` : ""}
      <div style="margin-top:22px">${meta(p)}<h3 style="font-size:30px;margin:8px 0 12px">${esc(p.title)}</h3><p>${esc(p.summary)}</p>${dls(p.downloads)}</div></div>`;
  }).join("");
  const nexts = (D.upNext || []).map((u) => `<div class="next">${meta({ status: "upcoming", award: u.award, course: u.course, dates: u.dates })}<h3>${esc(u.title)}</h3><p>${esc(u.summary)}</p></div>`).join("");

  chapter("work", "Projects", "Projects", "What I've been building", `
    <div class="work-list">
      ${(D.analyses || []).map(analysisBlock).join("")}
      ${(D.caseStudies || []).map(caseBlock).join("")}
    </div>
    <div class="small-work">${smalls}${nexts ? `<div>${nexts}</div>` : ""}</div>`);

  /* research */
  const R = D.research;
  if (R) {
    const imgs = (R.media || []).filter(has);
    chapter("research", "Research", R.org, esc(R.title), `
      <div class="split">
        <div>
          <p class="w-meta">${esc(R.role)} · ${esc(R.dates)}</p>
          <p class="story" style="margin-top:14px">${esc(R.story)}</p>
          <ul class="areas robo-tags">${(R.tags || []).map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
        </div>
        ${imgs.length ? `<div class="mosaic">${imgs.slice(0, 3).map((m) => zoom(m)).join("")}</div>` : ""}
      </div>`, "band-soft");
  }

  /* materials lab: one section */
  const L = D.lab;
  if (L) {
    const photos = (L.photos || []).filter(has);
    chapter("lab", "Lab", L.role, esc(L.title), `
      <div class="lab-top">${L.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}</div>
      <div class="labgrid">${photos.map((m, i) => `<button type="button" class="g${i + 1}" aria-label="Enlarge photo: ${esc(m.caption)}"><img src="${esc(m.src)}" alt="${esc(m.caption)}" data-cap="${esc(m.caption)}"><span class="lc" aria-hidden="true">${esc(m.caption)}</span></button>`).join("")}</div>`, "band-dark");
  }

  /* leadership */
  if (D.activities && D.activities.length) {
    chapter("leadership", "Leadership", "Leadership", "Beyond the classroom", `
      <div class="leads">${D.activities.map((a) => has(a.image) ? `
        <div class="lead-card"><div class="solo">${zoom(a.image)}</div>
          <div style="margin-top:20px"><p class="w-meta">${esc(a.org)}</p><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p></div></div>` : `
        <div class="lead-card noimg"><p class="big-org">${esc(a.org.split(",")[0])}</p>
          <div><p class="w-meta">${esc(a.org)}</p><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p></div></div>`).join("")}
      </div>`);
  }

  /* experience */
  chapter("experience", "Experience", "Experience", "A new role almost every semester", `
    <div class="roles">${D.experience.map((r) => `
      <div class="role">
        <p class="when">${esc(r.dates)}${r.current ? "<i>Current</i>" : ""}</p>
        <div><h3>${esc(r.role)}</h3><p class="org">${esc(r.org)}</p><ul>${r.points.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
      </div>`).join("")}</div>`, "band-soft");

  /* skills + education */
  const E = D.education;
  chapter("skills", "Skills", "Skills and school", "My toolbox", `
    <div class="two">
      <div class="skillgroups">${D.skills.map((s) => `<div><h3>${esc(s.group)}</h3><p>${s.items.map(esc).join(", ")}</p></div>`).join("")}</div>
      <div class="edu"><h3>${esc(E.school)}</h3><p class="deg">${esc(E.degree)}</p><p class="grad">${esc(E.detail)}</p>
        <h4>Relevant classes</h4><ul>${E.coursework.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
    </div>`);

  /* contact / seeking */
  const S = D.seeking || {};
  chapter("contact", "Contact", "What I'm looking for", esc(S.title || "Let's talk."), `
    <p class="lead">${esc(S.text || "")}</p>
    ${(S.areas || []).length ? `<ul class="areas" aria-label="Areas I'm interested in">${S.areas.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>` : ""}
    <a class="big" href="mailto:${esc(P.email)}">${esc(P.email)}</a>
    <p class="others"><a href="${esc(P.linkedin)}">${esc(P.linkedinLabel)} ↗</a>${P.github ? `<a href="${esc(P.github)}">${esc(P.githubLabel)} ↗</a>` : ""}<span>${esc(P.location)}</span></p>`, "contact band-accent");

  document.getElementById("main").innerHTML = hero + chapters.map((c) => c.html).join("");
  const navIds = ["about", "work", "approach", "research", "lab", "contact"];
  document.getElementById("nav-links").innerHTML = chapters.filter((c) => navIds.includes(c.id)).sort((a, b) => navIds.indexOf(a.id) - navIds.indexOf(b.id)).map((c) => `<li><a href="#${c.id}">${esc(c.label)}</a></li>`).join("");
  document.getElementById("brand").textContent = P.name;
  document.getElementById("footer").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(P.name)} · Designed and revised many times, like everything I make.</span><span>Last updated ${esc(D.lastUpdated)}</span>`;

  /* design slideshow */
  (function () {
    const root = document.querySelector(".showcase");
    if (!root) return;
    const slides = [...root.querySelectorAll(".sc-slide")], bars = [...root.querySelectorAll(".sc-bars button")], count = root.querySelector(".sc-count b");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const DUR = 6000; let i = 0, timer = null, paused = false;
    root.style.setProperty("--sc-dur", DUR + "ms");
    const go = (n) => {
      slides[i].classList.remove("on"); slides[i].setAttribute("aria-hidden", "true"); bars[i].classList.remove("on");
      i = (n + slides.length) % slides.length;
      slides[i].classList.add("on"); slides[i].removeAttribute("aria-hidden");
      bars[i].classList.remove("on"); void bars[i].offsetWidth; bars[i].classList.add("on");
      count.textContent = String(i + 1).padStart(2, "0");
      schedule();
    };
    const schedule = () => { clearTimeout(timer); if (!reduce && !paused) timer = setTimeout(() => go(i + 1), DUR); };
    root.querySelector(".sc-next").addEventListener("click", () => go(i + 1));
    root.querySelector(".sc-prev").addEventListener("click", () => go(i - 1));
    bars.forEach((b, k) => b.addEventListener("click", () => go(k)));
    root.addEventListener("mouseenter", () => { paused = true; root.classList.add("paused"); clearTimeout(timer); });
    root.addEventListener("mouseleave", () => { paused = false; root.classList.remove("paused"); go(i); });
    root.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); });
    let x0 = null;
    root.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    root.addEventListener("touchend", (e) => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
    schedule();
  })();

  /* image galleries */
  document.addEventListener("click", (e) => {
    const t = e.target.closest(".thumbs button[data-target]");
    if (!t) return;
    const stage = document.querySelector(`.stage[data-gallery="${t.dataset.target}"]`);
    const img = stage.querySelector("img");
    img.src = t.dataset.src; img.alt = t.dataset.cap; img.dataset.cap = t.dataset.cap;
    document.querySelector(`[data-gcap="${t.dataset.target}"]`).textContent = t.dataset.cap;
    t.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", b === t));
  });
  /* video switching */
  document.addEventListener("click", (e) => {
    const vt = e.target.closest(".thumbs button[data-vtarget]");
    if (!vt) return;
    const v = document.querySelector(`.stage[data-vgallery="${vt.dataset.vtarget}"] video`);
    const auto = vt.dataset.auto === "1";
    v.pause(); v.src = vt.dataset.src; v.poster = vt.dataset.poster; v.loop = auto; v.muted = auto;
    v.play().catch(() => {});
    document.querySelector(`[data-vcap="${vt.dataset.vtarget}"]`).textContent = vt.dataset.cap;
    vt.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", b === vt));
  });
  /* lightbox */
  const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lb-img"), lbCap = document.getElementById("lb-cap"), lbClose = document.getElementById("lb-close");
  let lastFocus = null;
  const close = () => { lb.classList.remove("open"); if (lastFocus) lastFocus.focus(); };
  document.addEventListener("click", (e) => {
    if (e.target.closest(".thumbs")) return;
    const btn = e.target.closest(".pair button, .mosaic button, .labgrid button, .solo button, .stage img");
    if (!btn) return;
    const el = btn.tagName === "IMG" ? btn : btn.querySelector("img");
    lastFocus = btn; lbImg.src = el.src; lbImg.alt = el.alt; lbCap.textContent = el.dataset.cap || "";
    lb.classList.add("open"); lbClose.focus();
  });
  lbClose.addEventListener("click", close);
  lb.addEventListener("click", (e) => { if (e.target === lb) close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && lb.classList.contains("open")) close(); });
})();
</script>
</body>
</html>
